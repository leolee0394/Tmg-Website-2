<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<title>The March Group -- Partnering with entrepreneurs in food and health</title>
<meta name="description" content="The March Group is backing exponential technology platforms for human and planetary health, and a new food paradigm.">
</head>
<body>
<header id="site-header" class="site-header"></header>

<main>
  <section class="hero">
    <div class="hero-bg-img" style="background-image:url('hero-bg.png')"></div>
    <div class="hero-scrim"></div>
    <div class="hero-inner wrap">
      <h1>We invest in <span id="hero-word" class="hero-word">food.</span></h1>
      <p class="hero-sub">Providing capital is not unique. Who we are, how we partner, and what we believe is.</p>
    </div>
    <div class="scroll-cue" aria-hidden="true"><span></span></div>
  </section>

  <section class="belief wrap">
    <h2>What we believe</h2>
    <p class="belief-intro" id="belief-intro"></p>
    <div id="values" class="accordion"></div>
  </section>

  <section class="showcase wrap">
    <div class="panel-head"><h2>We partner with founders building the future of food and health.</h2><a href="portfolio.html">Our portfolio</a></div>
    <div id="portfolio-showcase" class="pf-showcase"></div>
  </section>

  <section class="news-section wrap">
    <div class="panel-head"><h2>Insights</h2></div>
    <div id="home-insights-list" class="insights-grid"></div>
  </section>
</main>

<footer id="site-footer"></footer>
<script src="render.js"></script>

</body>
</html>
