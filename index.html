<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<title>Thematic VC | The March Group</title>
<meta name="description" content="The March Group is backing exponential technology platforms for human and planetary health, and a new food paradigm.">
<script>if(!window.matchMedia('(prefers-reduced-motion: reduce)').matches)document.documentElement.classList.add('motion');</script>
</head>
<body data-page="home" id="top">
<a class="skip" href="#main">Skip to content</a>
<header id="site-header" class="site-header"></header>
<main id="main">
  <section class="hero">
    <div class="wrap hero-grid">
      <div class="hero-copy">
        <p class="eyebrow" data-text="hero.splitLine"></p>
        <h1 data-text="hero.headline"></h1>
        <p class="lede" data-text="hero.sub"></p>
        <p><a class="link" href="people.html" data-text="sections.teamLink"></a></p>
      </div>
      <div class="specimen" aria-hidden="true">
        <svg viewBox="0 0 320 320" class="diagram" id="hero-diagram">
          <circle cx="160" cy="160" r="118" class="d-ring" />
          <circle cx="160" cy="160" r="86" class="d-ring soft" />
          <g class="d-nodes"></g>
        </svg>
      </div>
    </div>
  </section>

  <section class="sec wrap">
    <div class="panel-head"><span class="tag">01</span><h2 class="sec-h" data-text="sections.themes"></h2></div>
    <div id="themes"></div>
  </section>

  <section class="sec panel wrap">
    <div class="panel-head"><span class="tag">02</span><h2 class="sec-h" data-text="sections.numbers"></h2></div>
    <div class="stats" id="stats"></div>
  </section>

  <section class="sec wrap">
    <div class="sec-head"><div class="panel-head"><span class="tag">03</span><h2 class="sec-h" data-text="sections.portfolio"></h2></div><a href="portfolio.html" data-text="sections.portfolioLink"></a></div>
    <div class="pfgrid" id="pfgrid"></div>
  </section>

  <section class="sec wrap">
    <div class="sec-head"><div class="panel-head"><span class="tag">04</span><h2 class="sec-h" data-text="sections.news"></h2></div><a href="news.html" data-text="sections.newsLink"></a></div>
    <div class="nlist" id="news"></div>
  </section>

  <section class="close">
    <div class="wrap close-grid">
      <div>
        <h2 data-text="sections.contact"></h2>
        <p data-text="sections.contactSub"></p>
        <p><a class="btn" href="contact.html" data-text="sections.closeButton"></a></p>
      </div>
    </div>
  </section>
  <noscript><p class="wrap">This site needs JavaScript to show its content.</p></noscript>
</main>
<footer id="site-footer"></footer>
<script src="render.js"></script>
</body>
</html>
